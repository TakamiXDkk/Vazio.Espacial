

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazio Espacial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100%;
            background-color: #050510;
            background-image: url("./fundo.png");
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 18px 40px;
            background: transparent;
            border: 2px solid white;
            color: white;
            font-size: 20px;
            cursor: pointer;
            letter-spacing: 3px;
        }

        button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>
    <button onclick="alert('A anomalia foi encontrada!')">
        PROCURAR ANOMALIA
    </button>
</body>
</html>
