
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA */

#inicio {
    position: fixed;
    inset: 0;
    background-color: black;
    background-image: url("./fundo.png");
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

#inicio button {
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.75);
    border: 1px solid #d6ad55;
    color: #e5c77c;
    font-size: 19px;
    letter-spacing: 3px;
    cursor: pointer;
}

#inicio button:hover {
    background: #d6ad55;
    color: #222;
}

/* LOGIN */

#login {
    display: none;
    position: fixed;
    inset: 0;
    background: #858585;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 65px;
    padding: 25px;
}

.titulo {
    font-family: "Times New Roman", Georgia, serif;
    font-size: clamp(48px, 8vw, 105px);
    font-weight: normal;
    letter-spacing: 7px;
    text-align: center;
    color: #d6ad55;

    text-shadow:
        0 1px 0 #fff0b5,
        0 2px 2px #9b7027,
        0 5px 8px rgba(0, 0, 0, 0.4);
}

.campos {
    display: flex;
    flex-direction: column;
    gap: 22px;
    width: min(360px, 90%);
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;
    background: #a0a0a0;
    border: 1px solid #d6ad55;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #eeeeee;
}

.campos input:focus {
    border: 2px solid #e5c77c;
}
</style>
</head>

<body>

<section id="inicio">
    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>
</section>

<section id="login">
    <h1 class="titulo">ORDO CONSTELLATIO</h1>

    <div class="campos">
        <input type="text" placeholder="Username">
        <input type="email" placeholder="E-mail">
    </div>
</section>

<script>
function abrirLogin() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
