
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA */

#inicio {
    width: 100%;
    height: 100vh;
    background-color: #050510;
    background-image: url("./fundo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

#inicio button {
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* TELA DE LOGIN */

#login {
    display: none;
    position: fixed;
    inset: 0;
    background: #454545;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 65px;
    padding: 25px;
    overflow: hidden;
}

/* TÍTULO */

.titulo {
    position: relative;
    font-family: Impact, "Arial Narrow", sans-serif;
    font-size: clamp(65px, 10vw, 125px);
    font-weight: normal;
    letter-spacing: 5px;
    text-align: center;
    line-height: 1.15;
    transform: scaleY(1.3);

    background: linear-gradient(
        180deg,
        #c9a95d 0%,
        #8f692b 25%,
        #d4b46b 45%,
        #72501e 65%,
        #b28b43 85%,
        #6d4b1c 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    -webkit-text-stroke: 1px #76551f;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.6));
}

/* LINHAS DOURADAS */

.titulo::before,
.titulo::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 120%;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        #a98136,
        #e1c477,
        #a98136,
        transparent
    );

    transform: translateX(-50%);
}

.titulo::before {
    top: -25px;
}

.titulo::after {
    bottom: -25px;
}

/* CAMPOS */

.campos {
    display: flex;
    flex-direction: column;
    gap: 22px;
    width: min(360px, 90%);
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;
    background: #555555;
    border: 1px solid #987538;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #c5c5c5;
}

.campos input:focus {
    border: 2px solid #c5a052;
}

/* AJUSTE PARA CELULAR */

@media (max-width: 600px) {
    .titulo {
        font-size: 48px;
        letter-spacing: 2px;
    }

    .campos {
        width: 90%;
    }
}
</style>
</head>

<body>

<!-- PRIMEIRA PÁGINA -->

<section id="inicio">
    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>
</section>

<!-- LOGIN -->

<section id="login">

    <h1 class="titulo">ORDO CONSTELLATIO</h1>

    <div class="campos">
        <input type="text" placeholder="Username">
        <input type="email" placeholder="E-mail">
    </div>

</section>

<script>
function abrirLogin() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
