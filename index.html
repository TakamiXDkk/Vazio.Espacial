
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazio Espacial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-color: #050510;
            background-image: url("./fundo.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 18px 40px;
            background: rgba(0, 0, 0, 0.65);
            border: 2px solid white;
            color: white;
            font-size: 18px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            color: black;
            box-shadow: 0 0 25px white;
        }
    </style>
</head>

<body>

    <button onclick="alert('Investigação iniciada.')">
        PROCURAR ANOMALIA
    </button>

</body>
</html>
