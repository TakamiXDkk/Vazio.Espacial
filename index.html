
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA */

#inicio {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #050510;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#inicio img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

#inicio button {
    position: relative;
    z-index: 1;
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* SEGUNDA PÁGINA */

#login {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #484848;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 35px;
    padding: 30px 20px;
    overflow-y: auto;
}

/* TÍTULO */

.titulo {
    font-family: Georgia, serif;
    font-size: clamp(42px, 7vw, 90px);
    font-weight: normal;
    letter-spacing: 3px;
    text-align: center;
    white-space: nowrap;
    color: #a9823f;
    text-shadow: 1px 1px 1px #e0c17c,
                 2px 3px 3px #292014;
    transform: scaleY(1.25);
}

/* LINHAS */

.linha {
    width: min(650px, 85%);
    height: 1px;
    flex-shrink: 0;
    background: #a9823f;
}

/* CAMPOS E BOTÃO */

.campos {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: min(360px, 90%);
    flex-shrink: 0;
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;
    background: #555555;
    border: 1px solid #987538;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #d0d0d0;
}

.campos input:focus {
    border-color: #d0ad65;
}

#botaoCadastro {
    display: block;
    visibility: visible;
    width: 100%;
    min-height: 54px;
    flex-shrink: 0;

    background: #a9823f;
    border: 1px solid #d0ad65;
    color: #17130c;

    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
}

#botaoCadastro:hover {
    background: #c19b58;
}

#botaoCadastro:disabled {
    opacity: 0.6;
    cursor: wait;
}

/* MENSAGEM */

#mensagem {
    width: min(360px, 90%);
    color: white;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    min-height: 20px;
}

/* CELULAR */

@media (max-width: 600px) {
    .titulo {
        font-size: clamp(25px, 7vw, 34px);
        letter-spacing: 1px;
    }

    #login {
        gap: 28px;
    }
}
</style>
</head>

<body>

<!-- PRIMEIRA PÁGINA -->

<section id="inicio">

    <img src="./fundo.png" alt="Fundo">

    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>

</section>

<!-- SEGUNDA PÁGINA -->

<section id="login">

    <div class="linha"></div>

    <h1 class="titulo">𝕆ℝ𝔻𝕆 ℂ𝕆ℕ𝕊𝕋𝔼𝕃𝕃𝔸𝕋𝕀𝕆</h1>

    <div class="linha"></div>

    <div class="campos">

        <input
            type="text"
            id="username"
            placeholder="Username"
            maxlength="30"
            autocomplete="nickname"
        >

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            autocomplete="email"
        >

        <button
            id="botaoCadastro"
            type="button"
            onclick="cadastrar()"
        >
            CADASTRAR
        </button>

    </div>

    <p id="mensagem"></p>

</section>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://edbpmnsoolqfuxqzsguu.supabase.co';

const SUPABASE_KEY = 'sb_publishable_jg8_p1uy4CjVPQQPJM95BQ_ORayHJPT';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

window.abrirLogin = function() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
};

window.cadastrar = async function() {

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();

    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botaoCadastro");

    mensagem.style.color = "white";

    if (!username || !email) {
        mensagem.textContent = "Preencha o Username e o E-mail.";
        return;
    }

    if (username.length < 3) {
        mensagem.textContent = "O Username precisa ter pelo menos 3 caracteres.";
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mensagem.textContent = "Digite um endereço de e-mail válido.";
        return;
    }

    botao.disabled = true;
    botao.textContent = "ENVIANDO...";
    mensagem.textContent = "";

    try {

        const { error } = await supabase.auth.signInWithOtp({
            email: email,

            options: {
                emailRedirectTo: window.location.origin + window.location.pathname,

                data: {
                    username: username
                },

                shouldCreateUser: true
            }
        });

        if (error) throw error;

        mensagem.textContent =
            "Enviamos um link de confirmação para seu e-mail. Confira sua caixa de entrada.";

        mensagem.style.color = "#e5c98f";

    } catch (error) {

        console.error(error);

        mensagem.textContent =
            "Não foi possível realizar o cadastro: " + error.message;

        mensagem.style.color = "#ffaaaa";

    } finally {

        botao.disabled = false;
        botao.textContent = "CADASTRAR";

    }
};

const { data: { session } } = await supabase.auth.getSession();

if (session) {

    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";

    document.getElementById("mensagem").textContent =
        "E-mail confirmado! Seu cadastro foi realizado.";

    document.getElementById("mensagem").style.color = "#e5c98f";

}

</script>

</body>
</html>

</html>
