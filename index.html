
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA */

#inicio {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #050510;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#inicio img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

#inicio button {
    position: relative;
    z-index: 1;
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* SEGUNDA PÁGINA */

#login {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #484848;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding: 30px 20px;
    overflow-y: auto;
}

.titulo {
    font-family: Georgia, serif;
    font-size: clamp(42px, 7vw, 90px);
    font-weight: normal;
    letter-spacing: 3px;
    text-align: center;
    white-space: nowrap;
    color: #a9823f;
    text-shadow: 1px 1px 1px #e0c17c,
                 2px 3px 3px #292014;
    transform: scaleY(1.25);
}

.linha {
    width: min(650px, 85%);
    height: 1px;
    flex-shrink: 0;
    background: #a9823f;
}

.campos {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: min(360px, 90%);
    flex-shrink: 0;
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;
    background: #555555;
    border: 1px solid #987538;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #d0d0d0;
}

.campos input:focus {
    border-color: #d0ad65;
}

#senhaAdmin {
    border: 2px solid #c19b58;
    background: #3e3e3e;
}

#botaoCadastro,
.botao-voltar,
.botao-menu {
    cursor: pointer;
    letter-spacing: 2px;
}

#botaoCadastro {
    display: block;
    width: 100%;
    min-height: 54px;
    flex-shrink: 0;
    background: #a9823f;
    border: 1px solid #d0ad65;
    color: #17130c;
    font-size: 15px;
}

#botaoCadastro:hover {
    background: #c19b58;
}

#botaoCadastro:disabled {
    opacity: 0.6;
    cursor: wait;
}

.botao-voltar {
    width: min(360px, 90%);
    min-height: 50px;
    background: transparent;
    border: 1px solid #a9823f;
    color: #e0c17c;
    font-size: 14px;
}

.botao-voltar:hover {
    background: #a9823f;
    color: #17130c;
}

#mensagem {
    width: min(360px, 90%);
    color: white;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
    min-height: 20px;
}

/* TERCEIRA PÁGINA */

#menu {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #484848;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 55px;
    padding: 35px 20px;
    overflow-y: auto;
}

.titulo-menu {
    font-family: Georgia, serif;
    font-size: clamp(35px, 6vw, 76px);
    font-weight: normal;
    letter-spacing: 3px;
    text-align: center;
    white-space: nowrap;
    color: #a9823f;
    text-shadow: 1px 1px 1px #e0c17c,
                 2px 3px 3px #292014;
    transform: scaleY(1.25);
}

.botoes-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: min(460px, 90%);
}

.botao-menu {
    width: 100%;
    min-height: 68px;
    background: transparent;
    border: 1px solid #a9823f;
    color: #e0c17c;
    font-size: 16px;
    transition: background 0.2s, color 0.2s;
}

.botao-menu:hover {
    background: #a9823f;
    color: #17130c;
}

#avisoMenu {
    min-height: 22px;
    color: #d0ad65;
    font-size: 14px;
    text-align: center;
}

/* QUARTA PÁGINA */

#investigadores {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: #484848;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px;
    gap: 30px;
    overflow-y: auto;
}

.titulo-investigadores {
    font-family: Georgia, serif;
    font-size: clamp(27px, 5vw, 58px);
    font-weight: normal;
    letter-spacing: 2px;
    text-align: center;
    color: #a9823f;
    text-shadow: 1px 1px 1px #e0c17c,
                 2px 3px 3px #292014;
    margin-top: 15px;
}

#listaInvestigadores {
    width: min(600px, 90%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
}

.investigador-item {
    width: 100%;
    min-height: 55px;
    display: flex;
    align-items: center;
    padding: 12px 20px;
    border: 1px solid #a9823f;
    color: #e0c17c;
    background: rgba(0, 0, 0, 0.12);
    font-size: 16px;
    letter-spacing: 1px;
}

#mensagemInvestigadores {
    color: #d0ad65;
    font-size: 14px;
    text-align: center;
    min-height: 22px;
}

/* CELULAR */

@media (max-width: 600px) {
    .titulo {
        font-size: clamp(25px, 7vw, 34px);
        letter-spacing: 1px;
    }

    .titulo-menu {
        font-size: clamp(24px, 7vw, 40px);
        letter-spacing: 1px;
    }

    #login {
        gap: 20px;
    }

    #menu {
        gap: 45px;
    }

    .botao-menu {
        font-size: 13px;
    }

    .titulo-investigadores {
        font-size: clamp(23px, 6vw, 34px);
    }
}
</style>
</head>

<body>

<section id="inicio">
    <img src="./fundo.png" alt="Fundo">
    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>
</section>

<section id="login">

    <div class="linha"></div>

    <h1 class="titulo">𝕆ℝ𝔻𝕆 ℂ𝕆ℕ𝕊𝕋𝔼𝕃𝕃𝔸𝕋𝕀𝕆</h1>

    <div class="linha"></div>

    <div class="campos">

        <input type="text" id="username"
            placeholder="Username" maxlength="30"
            autocomplete="nickname">

        <input type="email" id="email"
            placeholder="E-mail" autocomplete="email">

        <input type="password" id="senhaAdmin"
            placeholder="SENHA ADMINISTRATIVA (OPCIONAL)"
            autocomplete="off">

        <button id="botaoCadastro" type="button"
            onclick="cadastrar()">
            CADASTRAR
        </button>

    </div>

    <p id="mensagem"></p>

    <button class="botao-voltar" type="button"
        onclick="voltarInicio()">
        VOLTAR
    </button>

</section>

<section id="menu">

    <div class="linha"></div>

    <h1 class="titulo-menu">
        𝔸ℕ𝕆𝕄𝔸𝕃𝕀𝔸 𝔼ℕℂ𝕆ℕ𝕋ℝ𝔸𝔻𝔸
    </h1>

    <div class="linha"></div>

    <div class="botoes-menu">

        <button class="botao-menu"
            onclick="mostrarAviso('A investigação ainda está sendo preparada.')">
            INVESTIGAR ANOMALIA
        </button>

        <button class="botao-menu"
            onclick="mostrarAviso('As regras e informações serão disponibilizadas em breve.')">
            REGRAS E INFORMAÇÕES
        </button>

        <button class="botao-menu"
            onclick="abrirInvestigadores()">
            INVESTIGADORES REGISTRADOS
        </button>

    </div>

    <p id="avisoMenu"></p>

</section>

<section id="investigadores">

    <div class="linha"></div>

    <h1 class="titulo-investigadores">
        INVESTIGADORES REGISTRADOS
    </h1>

    <div class="linha"></div>

    <div id="listaInvestigadores"></div>

    <p id="mensagemInvestigadores">
        Carregando investigadores...
    </p>

    <button class="botao-voltar" onclick="voltarMenu()">
        VOLTAR AO MENU
    </button>

</section>

<script type="module">

import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://edbpmnsoolqfuxqzsguu.supabase.co';

const SUPABASE_KEY =
'sb_publishable_jg8_p1uy4CjVPQQPJM95BQ_ORayHJPT';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const CHAVE_TEMPORARIA_ADMIN = "vazio_admin_pendente";

function mostrarPagina(pagina) {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "none";
    document.getElementById("menu").style.display = "none";
    document.getElementById("investigadores").style.display = "none";
    document.getElementById(pagina).style.display = "flex";
}

window.abrirLogin = async function() {
    const { data, error } = await supabase.auth.getSession();

    if (error) {
        mostrarPagina("login");
        return;
    }

    if (data.session) {
        mostrarPagina("menu");
    } else {
        mostrarPagina("login");
    }
};

window.voltarInicio = function() {
    mostrarPagina("inicio");
    document.getElementById("mensagem").textContent = "";
};

window.mostrarAviso = function(texto) {
    document.getElementById("avisoMenu").textContent = texto;
};

window.cadastrar = async function() {

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const senhaAdmin = document.getElementById("senhaAdmin").value;

    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botaoCadastro");

    mensagem.style.color = "white";

    if (!username || !email) {
        mensagem.textContent = "Preencha o Username e o E-mail.";
        return;
    }

    if (username.length < 3) {
        mensagem.textContent = "O Username precisa ter pelo menos 3 caracteres.";
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mensagem.textContent = "Digite um endereço de e-mail válido.";
        return;
    }

    botao.disabled = true;
    botao.textContent = "ENVIANDO...";
    mensagem.textContent = "";

    try {

        if (senhaAdmin.trim() !== "") {
            sessionStorage.setItem(CHAVE_TEMPORARIA_ADMIN, senhaAdmin);
        } else {
            sessionStorage.removeItem(CHAVE_TEMPORARIA_ADMIN);
        }

        const { error } = await supabase.auth.signInWithOtp({
            email: email,
            options: {
                emailRedirectTo:
                    window.location.origin + window.location.pathname,
                data: {
                    username: username
                },
                shouldCreateUser: true
            }
        });

        if (error) {
            throw error;
        }

        mensagem.textContent =
            "Enviamos um link de confirmação para seu e-mail. Abra o link neste mesmo navegador para concluir o cadastro.";

        mensagem.style.color = "#e5c98f";
        document.getElementById("senhaAdmin").value = "";

    } catch (error) {

        console.error(error);
        sessionStorage.removeItem(CHAVE_TEMPORARIA_ADMIN);

        mensagem.textContent =
            "Não foi possível realizar o cadastro: " + error.message;

        mensagem.style.color = "#ffaaaa";

    } finally {
        botao.disabled = false;
        botao.textContent = "CADASTRAR";
    }
};

async function validarSenhaAdministrativa() {

    const senha = sessionStorage.getItem(CHAVE_TEMPORARIA_ADMIN);

    if (!senha) {
        return "normal";
    }

    sessionStorage.removeItem(CHAVE_TEMPORARIA_ADMIN);

    const { data, error } = await supabase.rpc(
        "claim_admin",
        { p_password: senha }
    );

    if (error) {
        console.error("Erro ao validar senha administrativa:", error);
        return "erro";
    }

    if (data === true) {
        return "admin";
    }

    return "incorreta";
}

window.abrirInvestigadores = async function() {

    mostrarPagina("investigadores");

    const lista = document.getElementById("listaInvestigadores");
    const mensagem = document.getElementById("mensagemInvestigadores");

    lista.innerHTML = "";
    mensagem.textContent = "Carregando investigadores...";

    try {

        const { data, error } = await supabase
            .from("investigadores_publicos")
            .select("username")
            .order("username", { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
            mensagem.textContent = "Nenhum investigador registrado ainda.";
            return;
        }

        data.forEach((investigador) => {
            const item = document.createElement("div");
            item.className = "investigador-item";
            item.textContent = investigador.username;
            lista.appendChild(item);
        });

        mensagem.textContent =
            data.length + (data.length === 1
                ? " investigador registrado."
                : " investigadores registrados.");

    } catch (error) {
        console.error(error);
        mensagem.textContent =
            "Não foi possível carregar os investigadores. Tente novamente.";
    }
};

window.voltarMenu = function() {
    mostrarPagina("menu");
};

async function verificarConfirmacao() {

    const parametros = new URLSearchParams(window.location.search);

    const veioDeConfirmacao =
        parametros.has("code") ||
        window.location.hash.includes("access_token=");

    const { data, error } = await supabase.auth.getSession();

    if (veioDeConfirmacao) {

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        if (!error && data.session) {

            const resultadoAdmin = await validarSenhaAdministrativa();

            mostrarPagina("menu");

            if (resultadoAdmin === "admin") {
                alert("Acesso administrativo ativado com sucesso!");
            } else if (resultadoAdmin === "incorreta") {
                alert("Cadastro confirmado! A senha administrativa estava incorreta. Sua conta terá acesso normal.");
            } else if (resultadoAdmin === "erro") {
                alert("Cadastro confirmado, mas não foi possível validar a senha administrativa.");
            }

        } else {
            sessionStorage.removeItem(CHAVE_TEMPORARIA_ADMIN);
            mostrarPagina("login");
        }
    }
}

verificarConfirmacao();

</script>

</body>
</html>
