
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* TELA INICIAL */

#inicio {
    position: fixed;
    inset: 0;
    background-color: #050510;
    background-image: url("./fundo.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

#inicio button {
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* TELA DE LOGIN */

#login {
    display: none;
    position: fixed;
    inset: 0;
    background: #777777;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 55px;
    padding: 20px;
}

.titulo {
    font-family: Georgia, serif;
    font-size: clamp(35px, 7vw, 75px);
    font-weight: bold;
    letter-spacing: 5px;
    text-align: center;

    background: linear-gradient(
        180deg,
        #fff4b0,
        #e6c45c,
        #a87518,
        #ffe88a,
        #9b6814
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.45));
    animation: flutuar 3s ease-in-out infinite;
}

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-18px);
    }
}

.campos {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: min(350px, 90%);
}

.campos input {
    width: 100%;
    height: 55px;
    padding: 15px;
    border: 2px solid #c49a38;
    border-radius: 3px;
    background: #929292;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #eeeeee;
}
</style>
</head>

<body>

<section id="inicio">
    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>
</section>

<section id="login">
    <h1 class="titulo">ORDO CONSTELLATIO</h1>

    <div class="campos">
        <input type="text" placeholder="Username">
        <input type="email" placeholder="E-mail">
    </div>
</section>

<script>
function abrirLogin() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
