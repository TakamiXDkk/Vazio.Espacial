
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA - ORIGINAL */

#inicio {
    width: 100%;
    height: 100vh;
    background-color: #050510;
    background-image: url("./fundo.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

#inicio button {
    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* LOGIN */

#login {
    display: none;
    position: fixed;
    inset: 0;
    background: #858585;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 65px;
    padding: 25px;
}

.titulo {
    font-family: Impact, "Arial Narrow", sans-serif;
    font-size: clamp(65px, 10vw, 125px);
    font-weight: normal;
    letter-spacing: 5px;
    text-align: center;
    line-height: 1.15;
    transform: scaleY(1.3);

    background: linear-gradient(
        180deg,
        #fff9d9 0%,
        #d8bd78 15%,
        #fff1ad 30%,
        #92702e 48%,
        #e8cf87 62%,
        #fff4c4 75%,
        #94702b 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    -webkit-text-stroke: 1px #b18b42;

    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.5));
}

.campos {
    display: flex;
    flex-direction: column;
    gap: 22px;
    width: min(360px, 90%);
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;
    background: #a0a0a0;
    border: 1px solid #d6ad55;
    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #eeeeee;
}

.campos input:focus {
    border: 2px solid #e5c77c;
}
</style>
</head>

<body>

<section id="inicio">
    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>
</section>

<section id="login">
    <h1 class="titulo">ORDO CONSTELLATIO</h1>

    <div class="campos">
        <input type="text" placeholder="Username">
        <input type="email" placeholder="E-mail">
    </div>
</section>

<script>
function abrirLogin() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
