
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazio Espacial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: black;
}

/* PRIMEIRA PÁGINA */

#inicio {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    background: #050510;

    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#inicio img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

#inicio button {
    position: relative;
    z-index: 1;

    padding: 18px 35px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid white;
    color: white;
    font-size: 20px;
    cursor: pointer;
    letter-spacing: 2px;
}

#inicio button:hover {
    background: white;
    color: black;
}

/* SEGUNDA PÁGINA */

#login {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;

    background: #484848;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 65px;
    padding: 25px;
}

/* TÍTULO */

.titulo {
    font-family: Georgia, serif;
    font-size: clamp(42px, 7vw, 90px);
    font-weight: normal;
    letter-spacing: 3px;
    text-align: center;
    white-space: nowrap;

    color: #a9823f;
    text-shadow: 1px 1px 1px #e0c17c,
                 2px 3px 3px #292014;

    transform: scaleY(1.25);
}

/* LINHAS */

.linha {
    width: min(650px, 85%);
    height: 1px;
    background: #a9823f;
}

/* CAMPOS */

.campos {
    display: flex;
    flex-direction: column;
    gap: 22px;
    width: min(360px, 90%);
}

.campos input {
    width: 100%;
    height: 58px;
    padding: 15px;

    background: #555555;
    border: 1px solid #987538;

    color: white;
    font-size: 17px;
    outline: none;
}

.campos input::placeholder {
    color: #d0d0d0;
}

.campos input:focus {
    border-color: #d0ad65;
}

/* CELULAR */

@media (max-width: 600px) {
    .titulo {
        font-size: 34px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<!-- PRIMEIRA PÁGINA -->

<section id="inicio">

    <img src="./fundo.png" alt="Fundo">

    <button type="button" onclick="abrirLogin()">
        PROCURAR ANOMALIA
    </button>

</section>

<!-- SEGUNDA PÁGINA -->

<section id="login">

    <div class="linha"></div>

    <h1 class="titulo">𝕆ℝ𝔻𝕆 ℂ𝕆ℕ𝕊𝕋𝔼𝕃𝕃𝔸𝕋𝕀𝕆</h1>

    <div class="linha"></div>

    <div class="campos">
        <input type="text" placeholder="Username">
        <input type="email" placeholder="E-mail">
    </div>

</section>

<script>
function abrirLogin() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("login").style.display = "flex";
}
</script>

</body>
</html>
