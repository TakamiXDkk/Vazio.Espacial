

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazio Espacial</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #050510;
            background-image: url("./fundo.png");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        button {
            padding: 18px 35px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            color: white;
            font-size: 20px;
            cursor: pointer;
            letter-spacing: 2px;
        }

        button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <button onclick="alert('Anomalia encontrada!')">
        PROCURAR ANOMALIA
    </button>

</body>
</html>
